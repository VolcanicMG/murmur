# Windows onedir build: manual (workflow_dispatch) or on a v* tag. Windows runners bill 2x: this is not run on every push.
name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # attestation signing (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: python -m unittest discover tests
      - run: ./packaging/build.ps1 -Python python
      - run: Compress-Archive -Path dist/murmur -DestinationPath murmur-windows.zip
      - run: |
          $h = (Get-FileHash murmur-windows.zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("SHA256SUMS.txt", "$h  murmur-windows.zip`n")
      - if: ${{ !github.event.repository.private }}  # attestations need a public repo (or Enterprise)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: murmur-windows.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: murmur-windows
          path: |
            murmur-windows.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/RELEASE_NOTES_HEADER.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: murmur-windows
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sed "s|@REPO@|$GITHUB_REPOSITORY|g" packaging/RELEASE_NOTES_HEADER.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" murmur-windows.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
